name: Unity CLI license probe

on:
  push:
    branches:
      - fadi/sdk-5790
    paths:
      - .github/workflows/unity-cli-probe.yml

permissions:
  contents: read

jobs:
  probe-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
      UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
      UNITY_NON_INTERACTIVE: "1"
      UNITY_NO_UPDATE_CHECK: "1"
      UNITY_VERSION: 6000.4.11f1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Create demo .env
        uses: ./.github/actions/create-demo-env
        with:
          onesignal-app-id: ${{ vars.APPIUM_ONESIGNAL_APP_ID }}
          onesignal-api-key: ${{ secrets.APPIUM_ONESIGNAL_API_KEY }}

      - name: Install Unity CLI
        run: |
          brew install --cask unity-cli
          unity --version

      - name: Inspect CLI auth and license state
        continue-on-error: true
        run: |
          set -x
          unity auth status || true
          unity license status || true
          unity license activate --help || true

      - name: Install Unity Editor with iOS module
        run: unity install "$UNITY_VERSION" -m ios

      - name: License state after Editor install
        continue-on-error: true
        run: unity license status || true

      - name: Build iOS Xcode project
        run: |
          unity build examples/demo \
            --target iOS \
            --execute-method BuildScript.BuildiOSDevice \
            --allow-dirty-build
          ls -la examples/demo/Build/iOS

      - name: License state after build
        if: always()
        continue-on-error: true
        run: unity license status || true
